[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nammaspace-intake-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.5,<3",
  "PyJWT[crypto]>=2.9,<3",
  "Pillow>=10.4,<12",
  "pillow-heif>=0.18,<2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
